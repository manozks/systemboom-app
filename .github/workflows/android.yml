name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'systemboom_flutter/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: systemboom_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ../systemboom.apk

      - uses: actions/upload-artifact@v4
        with:
          name: systemboom-apk
          path: systemboom.apk

      # Rolling release so there is always one stable download link:
      # https://github.com/<owner>/<repo>/releases/tag/android-latest
      - name: Publish to the android-latest release
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: Android APK (latest)
          body: |
            Latest debug-signed release APK built from `${{ github.sha }}`.
            Install by opening the .apk on an Android phone (allow "install unknown apps").
          artifacts: systemboom.apk
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          commit: ${{ github.sha }}
