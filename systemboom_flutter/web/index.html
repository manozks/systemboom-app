  <script>

      l.rel = 'preload'; l.as = 'fetch'; l.crossOrigin = 'anonymous';

      document.head.appendChild(l);
    })();
  </script>

    #boot img{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 22px rgba(0,0,0,.7))}
    #boot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
