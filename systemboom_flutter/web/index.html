<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SYSTEMBOOM">
  <meta name="theme-color" content="#07090c">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="systemboom_app">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>

  <title>SYSTEMBOOM</title>
  <link rel="manifest" href="manifest.json">
  <!-- start fetching the heaviest art / font while the engine boots -->
  <link rel="preload" href="assets/assets/images/ai-nav.webp" as="image" fetchpriority="high">
  <link rel="preload" href="assets/assets/images/hero-nobomb.webp" as="image" fetchpriority="high">
  <link rel="preload" href="assets/assets/fonts/Figtree.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    html,body{margin:0;background:#07090c}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 40% at 50% 30%,#2a1608,#07090c);z-index:9;transition:opacity .35s}
    #boot i{width:44px;height:44px;border-radius:50%;border:4px solid #3a2a1a;border-top-color:#ff7a1a;animation:bs 0.9s linear infinite;box-shadow:0 0 18px rgba(255,122,26,.5)}
    @keyframes bs{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="boot"><i></i></div>
  <script>window.addEventListener("flutter-first-frame",function(){var b=document.getElementById("boot");if(!b)return;b.style.opacity=0;setTimeout(function(){b.remove()},380)});</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
